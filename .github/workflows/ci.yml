name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and test
    runs-on: ubuntu-latest
    container:
      image: texlive/texlive:TL2025-historic
    timeout-minutes: 45

    steps:
      - name: Install Python, make, and git
        run: |
          apt-get update -qq
          apt-get install -y --no-install-recommends git make python3 python3-pytest

      - name: Checkout
        uses: actions/checkout@v4

      # The container runs as a different user than the one owning the checkout,
      # so git refuses the repo as "dubious ownership" and tests that shell out
      # to git (tests/test_infrastructure.py) fail with exit 128.
      # Do not delete this as redundant: actions/checkout registers
      # safe.directory only for its own step, so later steps still need it.
      - name: Mark workspace safe for git
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Lint LaTeX sources
        run: make lint

      - name: Build LaTeX document
        run: make build

      # `make test` is pytest followed by the shell harness. Issue #51 collapsed
      # the two steps into one target so that what CI runs and what a
      # contributor runs cannot drift apart.
      - name: Run the test suite
        run: make test

      - name: Upload main.pdf
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: main-pdf
          path: main.pdf
          if-no-files-found: ignore
