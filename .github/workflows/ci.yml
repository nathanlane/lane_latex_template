name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and test
    runs-on: ubuntu-latest
    container:
      image: texlive/texlive:TL2025-historic
    timeout-minutes: 45

    steps:
      - name: Install Python, make, and git
        run: |
          apt-get update -qq
          apt-get install -y --no-install-recommends git make python3 python3-pytest

      - name: Checkout
        uses: actions/checkout@v4

      - name: Check package dependencies
        run: make check-deps

      - name: Lint LaTeX sources
        run: make lint

      - name: Build LaTeX document
        run: make build

      - name: Run pytest suite
        run: python3 -m pytest -q

      - name: Run shell test suite
        run: bash tests/run-tests.sh

      - name: Upload main.pdf
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: main-pdf
          path: main.pdf
          if-no-files-found: ignore
