name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and test
    runs-on: ubuntu-latest
    container:
      image: texlive/texlive:TL2025-historic
    timeout-minutes: 45

    steps:
      # poppler-utils supplies pdftotext/pdfinfo. Without it the PDF-text
      # regression assertions in tests/test_regression_harness.py skip silently,
      # so footnote-mark and appendix-title leakage is caught only locally.
      - name: Install Python, make, git, and Poppler
        run: |
          apt-get update -qq
          apt-get install -y --no-install-recommends git make python3 python3-pytest poppler-utils

      - name: Checkout
        uses: actions/checkout@v4

      # The container runs as a different user than the one owning the checkout,
      # so git refuses the repo as "dubious ownership" and tests that shell out
      # to git (tests/test_infrastructure.py) fail with exit 128.
      # Do not delete this as redundant: actions/checkout registers
      # safe.directory only for its own step, so later steps still need it.
      - name: Mark workspace safe for git
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Check package dependencies
        run: make check-deps

      - name: Lint LaTeX sources
        run: make lint

      - name: Build LaTeX document
        run: make build

      - name: Run pytest suite
        run: python3 -m pytest -q

      - name: Run shell test suite
        run: bash tests/run-tests.sh

      - name: Upload main.pdf
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: main-pdf
          path: main.pdf
          if-no-files-found: ignore
